remote_theme: jekyll/minima@1e8a445
plugins:
  - jekyll-remote-theme
minima:
  show_excerpts: true
  skin: solarized-dark
  hide_site_feed_link: true

title: dark7samurai
description: Мои статьи, ссылки и всякое разное!

header_pages:
  - index.md
  - heart.md

markdown: CommonMarkGhPages
commonmark:
  options: ["UNSAFE", "SMART", "FOOTNOTES"]
  extensions: ["strikethrough", "autolink", "table", "tagfilter"]
